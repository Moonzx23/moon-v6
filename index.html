<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoonBot V6</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#080b14;
color:white;
height:100vh;
display:flex;
overflow:hidden
}
body.light{background:#f4f5f8;color:#111}

#app{display:flex;width:100%;height:100%}

#side{
width:240px;
background:#101522;
padding:18px;
border-right:1px solid #293044
}
.light #side,.light #top,.light #bottom{background:white}

.logo{font-size:25px;font-weight:bold;margin-bottom:4px}
.ver{color:#6fdfff;font-size:12px;margin-bottom:20px}

button,select{
border:0;
border-radius:9px;
padding:10px;
cursor:pointer
}

.sidebtn{
width:100%;
margin:5px 0;
background:#1a2132;
color:white;
text-align:left
}

.light .sidebtn{
background:#edf0f6;
color:#111
}

#main{flex:1;display:flex;flex-direction:column}

#top{
height:60px;
padding:0 20px;
background:#101522;
border-bottom:1px solid #293044;
display:flex;
align-items:center;
justify-content:space-between
}

.online{color:#4cff9b}

#chat{
flex:1;
overflow-y:auto;
padding:25px
}

.welcome{
text-align:center;
margin:50px auto;
max-width:700px
}

.welcome h1{font-size:42px}

.cardbox{
display:flex;
gap:12px;
margin-top:25px
}

.card{
flex:1;
background:#101522;
padding:20px;
border-radius:14px;
border:1px solid #293044
}

.msg{
max-width:800px;
margin:12px auto;
padding:14px;
border-radius:13px;
white-space:pre-wrap;
line-height:1.5
}

.user{background:#303a70}
.bot{
background:#101522;
border:1px solid #293044
}

.name{
font-size:11px;
color:#6fdfff;
font-weight:bold;
margin-bottom:5px
}

#bottom{
padding:15px;
background:#101522;
border-top:1px solid #293044
}

#box{
max-width:850px;
margin:auto;
display:flex;
gap:8px
}

#input{
flex:1;
height:52px;
resize:none;
background:#1a2132;
color:white;
border:1px solid #30394f;
border-radius:12px;
padding:14px;
outline:none
}

.light #input{
background:#edf0f6;
color:#111
}

.send{
width:55px;
background:#735cff;
color:white;
font-size:20px
}

.voice{background:#293249;color:white}

#settings{
position:fixed;
right:20px;
top:75px;
width:300px;
background:#101522;
border:1px solid #30394f;
border-radius:15px;
padding:18px;
z-index:20;
display:none;
box-shadow:0 15px 50px #0008
}

#settings.show{display:block}

.light #settings{
background:white;
color:#111
}

.setting{
margin:15px 0
}

.setting label{
display:block;
font-size:13px;
color:#9da7bd;
margin-bottom:6px
}

.setting select{
width:100%;
background:#1a2132;
color:white
}

.light .setting select{
background:#edf0f6;
color:#111
}

#intro{
position:fixed;
inset:0;
background:#02030a;
z-index:999;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
animation:hide 1s ease 4s forwards
}

.moon{
width:190px;
height:190px;
border-radius:50%;
background:radial-gradient(circle at 35% 30%,#fff,#aaa 55%,#444);
box-shadow:0 0 50px white,0 0 130px #6675ff;
animation:zoom 4s ease
}

.introtitle{
font-size:45px;
letter-spacing:8px;
margin-top:25px
}

@keyframes zoom{
0%{transform:scale(.4)}
100%{transform:scale(1)}
}

@keyframes hide{
to{opacity:0;visibility:hidden}
}

@media(max-width:650px){
#side{display:none}
.cardbox{flex-direction:column}
}
</style>
</head>

<body>

<div id="intro">
<div class="moon"></div>
<div class="introtitle">MOONBOT</div>
<div>CREATED BY NAZREEL • 2026</div>
</div>

<div id="app">

<aside id="side">

<div class="logo">🌙 MoonBot</div>
<div class="ver">V6 CODING ROBOT</div>

<button class="sidebtn" onclick="newChat()">＋ New Chat</button>
<button class="sidebtn" onclick="toggleSettings()">⚙️ Settings</button>
<button class="sidebtn" onclick="showHistory()">🕘 History</button>
<button class="sidebtn" onclick="clearHistory()">🗑️ Clear History</button>

<br>

<div class="ver">SPEED</div>

<button class="sidebtn" onclick="setSpeed('Standard')">Standard</button>
<button class="sidebtn" onclick="setSpeed('Medium')">Medium</button>
<button class="sidebtn" onclick="setSpeed('Fast')">Fast</button>

</aside>

<main id="main">

<header id="top">
<span class="online">● MoonBot Online</span>
<span id="speed">Standard</span>
</header>

<section id="chat">

<div class="welcome" id="welcome">

<h1>🌙 MoonBot V6</h1>

<p>Futuristic Coding Robot created by Nazreel.</p>

<div class="cardbox">

<div class="card">
<b>👨‍💻 Creator</b><br>
Nazreel • 2026
</div>

<div class="card">
<b>⚡ Coding</b><br>
HTML • CSS • JavaScript • Python
</div>

<div class="card">
<b>🧠 Knowledge</b><br>
BM • English • General Knowledge
</div>

</div>
</div>

</section>

<footer id="bottom">

<div id="box">

<button class="send voice" onclick="voiceInput()">🎤</button>

<textarea
id="input"
placeholder="Tanya MoonBot..."
></textarea>

<button class="send" onclick="sendMessage()">➤</button>

</div>

</footer>

</main>
</div>

<div id="settings">

<h2>⚙️ Settings</h2>

<div class="setting">
<label>Theme</label>
<button class="sidebtn" onclick="toggleTheme()">🌙 Dark / ☀️ White</button>
</div>

<div class="setting">
<label>Mood</label>

<select id="mood">
<option>Biasa</option>
<option>Gembira</option>
<option>Sedih</option>
<option>Marah</option>
</select>

</div>

<div class="setting">
<label>Language</label>

<select id="language">
<option>Bahasa Melayu</option>
<option>English</option>
<option>Español</option>
<option>Français</option>
<option>日本語</option>
<option>中文</option>
<option>한국어</option>
</select>

</div>

<button class="sidebtn" onclick="toggleVoice()">
🔊 Voice ON / OFF
</button>

<button class="sidebtn" onclick="toggleSettings()">
Tutup Settings
</button>

</div>

<script>

/* =========================
   MOONBOT V6
========================= */

let speed="Standard";
let voice=false;
let messages=[];

const input=document.getElementById("input");
const chat=document.getElementById("chat");

/* ENTER = SEND
   SHIFT + ENTER = NEW LINE
*/

input.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

sendMessage();

}

});


function sendMessage(){

const text=input.value.trim();

if(text==="") return;

addMessage("YOU",text,"user");

input.value="";

messages.push(text);

localStorage.setItem(
"moon_messages",
JSON.stringify(messages)
);

let delay=700;

if(speed==="Fast") delay=150;
if(speed==="Medium") delay=350;

setTimeout(function(){

let answer=brain(text);

addMessage("MOONBOT",answer,"bot");

if(voice){
speak(answer);
}

},delay);

}


function addMessage(name,text,type){

document.getElementById("welcome").style.display="none";

const div=document.createElement("div");

div.className="msg "+type;

div.innerHTML=
'<div class="name">'+name+'</div>'+
escapeHTML(text);

chat.appendChild(div);

chat.scrollTop=chat.scrollHeight;

}


function escapeHTML(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}


function brain(text){

let q=text.toLowerCase();

q=q
.replaceAll("sape","siapa")
.replaceAll("sapa","siapa")
.replaceAll("siape","siapa")
.replaceAll("ape","apa")
.replaceAll("nk","nak")
.replaceAll("tk","tak")
.replaceAll("yg","yang")
.replaceAll("dgn","dengan")
.replaceAll("camne","bagaimana")
.replaceAll("cmne","bagaimana");

if(q.includes("hai") || q.includes("hello") || q==="hi")
return "HAAAII 🔥🌙 MoonBot V6 dah ready!";

if(q.includes("siapa pencipta") ||
q.includes("siapa buat moonbot") ||
q.includes("creator"))
return "Pencipta MoonBot ialah Nazreel. Projek ini bermula pada tahun 2026 menggunakan HTML, CSS dan JavaScript dengan bantuan ChatGPT.";

if(q.includes("moonbot"))
return "MoonBot ialah chatbot futuristik yang dibina oleh Nazreel menggunakan HTML, CSS dan JavaScript.";

if(q.includes("sejarah"))
return "MoonBot bermula daripada idea Nazreel pada tahun 2026. Projek ini berkembang melalui beberapa versi sehingga V6.";

if(q.includes("html"))
return "HTML digunakan untuk membina struktur laman web.";

if(q.includes("css"))
return "CSS digunakan untuk design, warna, susun atur dan animasi.";

if(q.includes("javascript"))
return "JavaScript digunakan untuk fungsi interaktif seperti chatbot, Settings dan animasi.";

if(q.includes("python"))
return "Python ialah bahasa pengaturcaraan yang banyak digunakan untuk AI, data dan automation.";

if(q.includes("berapa negeri malaysia"))
return "Malaysia mempunyai 13 negeri dan 3 Wilayah Persekutuan.";

if(q.includes("ibu negara malaysia"))
return "Ibu negara Malaysia ialah Kuala Lumpur.";

if(q.includes("ibu negara jepun"))
return "Ibu negara Jepun ialah Tokyo.";

if(q.includes("ibu negara thailand"))
return "Ibu negara Thailand ialah Bangkok.";

if(q.includes("ibu negara indonesia"))
return "Ibu negara Indonesia ialah Jakarta.";

if(q.includes("apa itu haiwan"))
return "Haiwan ialah organisma hidup yang biasanya bergerak dan memperoleh tenaga daripada makanan.";

if(q.includes("sedih"))
return "Kalau kau tengah sedih, cerita je dekat MoonBot. 🌙";

if(q.includes("terima kasih") || q.includes("thanks"))
return "Sama-sama wei 😎🌙";

return "Aku belum ada jawapan khusus untuk soalan tu dalam V6. Cuba tanya tentang MoonBot, coding, Malaysia atau pengetahuan am.";

}


function toggleSettings(){

document
.getElementById("settings")
.classList.toggle("show");

}


function toggleTheme(){

document.body.classList.toggle("light");

localStorage.setItem(
"moon_theme",
document.body.classList.contains("light")
?"light":"dark"
);

}


function setSpeed(value){

speed=value;

document.getElementById("speed").textContent=value;

localStorage.setItem("moon_speed",value);

}


function toggleVoice(){

voice=!voice;

localStorage.setItem("moon_voice",voice);

alert(
voice
?"Voice ON 🔊"
:"Voice OFF 🔇"
);

}


function speak(text){

if(!window.speechSynthesis) return;

speechSynthesis.cancel();

let u=new SpeechSynthesisUtterance(text);

u.lang="ms-MY";

speechSynthesis.speak(u);

}


function voiceInput(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert("Browser kau tak support voice input.");

return;

}

const recognition=new SpeechRecognition();

recognition.lang="ms-MY";

recognition.onresult=function(e){

input.value=
e.results[0][0].transcript;

};

recognition.start();

}


function newChat(){

chat.innerHTML=`

<div class="welcome" id="welcome">

<h1>🌙 MoonBot V6</h1>

<p>New chat started.</p>

</div>

`;

input.focus();

}


function showHistory(){

if(messages.length===0){

addMessage(
"MOONBOT",
"Belum ada history.",
"bot"
);

return;

}

addMessage(
"MOONBOT",
"History:\n\n"+messages.join("\n"),
"bot"
);

}


function clearHistory(){

messages=[];

localStorage.removeItem("moon_messages");

newChat();

}


function load(){

const theme=
localStorage.getItem("moon_theme");

if(theme==="light")
document.body.classList.add("light");

speed=
localStorage.getItem("moon_speed")
||"Standard";

voice=
localStorage.getItem("moon_voice")
==="true";

messages=
JSON.parse(
localStorage.getItem("moon_messages")
||"[]"
);

document.getElementById("speed").textContent=speed;

}

load();

</script>

</body>
</html>
